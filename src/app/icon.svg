      <stop stop-color="#DFAE2A"/>
      <stop offset="0.5" stop-color="#B88414"/>
      <stop offset="1" stop-color="#8C6239"/>
    </linearGradient>
  </defs>
  <!-- Parchment tile with organic fantasy curves -->
